# Serves the app under the same paths the old Tomcat/Virgo did, so the load
# balancer rules and its health check (GET .../geppetto/build/vfb.json) are
# unchanged.
server {
    listen 8080;
    root /srv;

    # Behind a proxy on 443: send relative Location headers, never http://host:8080/...
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml text/xml image/svg+xml;
    gzip_min_length 1024;

    # vfb.xmi: nginx has no type for it; as XML it is compressed (214 kB -> ~20 kB)
    location ~ \.xmi$ {
        default_type application/xml;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # the page: any query (?id=, ?i=, ...) is read by the app itself
    location = /org.geppetto.frontend/geppetto {
        default_type text/html;
        add_header Cache-Control "no-cache";
        try_files /org.geppetto.frontend/geppetto/build/geppetto.html =404;
    }

    # bundles and model files keep their names across releases: revalidate
    location /org.geppetto.frontend/geppetto/build/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /org.geppetto.frontend/geppetto/node_modules/ {
        try_files $uri =404;
    }

    # Anything else under the app (old links, the old Geppetto dashboard, project
    # listings, /org.geppetto.frontend/geppetto/ with a trailing slash) goes to the
    # one VFB page. A redirect, not the page itself: served at a deeper path the
    # page's relative links (geppetto/build/...) would resolve one level too deep
    # and every bundle would come back as HTML.
    location = /org.geppetto.frontend {
        return 302 /org.geppetto.frontend/geppetto$is_args$args;
    }
    location /org.geppetto.frontend/ {
        return 302 /org.geppetto.frontend/geppetto$is_args$args;
    }

    location = / {
        return 302 /org.geppetto.frontend/geppetto$is_args$args;
    }
}
