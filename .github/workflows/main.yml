# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run.
# Pull requests build and test but never publish images (see "Registry credentials"
# below). Dependabot branches are excluded from the push trigger so each PR is built
# once, via the pull_request event, rather than twice.
on:
  push:
    branches:
      - '**'
      - '!dependabot/**'
    tags: 'v*'
  pull_request:
    branches: '**'
  workflow_dispatch:
  workflow_run:
    workflows: [Build]
    types: [completed]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Build the static image, publish it, and run the browser tests against it
  deploy-test:
    # The type of runner that the job will run on
    runs-on: ubuntu-22.04
    # total job timeout:
    timeout-minutes: 120

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      
      # Decide based on branch which servers to use
      # On a pull_request event GITHUB_REF is refs/pull/<n>/merge and github.sha is the
      # ephemeral merge commit. The Dockerfile clones this repo by branch name and checks
      # out buildRef, so neither is usable: resolve the PR head ref and sha instead.
      - name: Pass branch
        id: branch
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            REF="${PR_HEAD_REF}"
            SHA="${PR_HEAD_SHA}"
          else
            REF="$(echo "${GITHUB_REF}" | sed 's@refs/heads/@@g' | sed 's@refs/tags/@@g')"
            SHA="${GITHUB_SHA}"
          fi
          # Docker tags can't contain "/" (or "\"), so branches like fix/foo or
          # feature/bar -- and PR head refs, which are branch names too -- need a
          # slash-free "clean" form for image tags. A Docker tag also can't start
          # with "." or "-", so guard the (unlikely, but not impossible if REF is
          # ever empty) case of `clean` collapsing to something starting with one
          # of those, or to nothing at all.
          CLEAN="$(echo "${REF}" | sed 's@[/\\]@-@g')"
          CLEAN="$(echo "${CLEAN}" | sed 's@^[-.]*@@')"
          if [ -z "${CLEAN}" ]; then
            CLEAN="unknown"
          fi
          {
            echo "value=${REF}"
            echo "clean=${CLEAN}"
            echo "sha=${SHA}"
          } >> "${GITHUB_OUTPUT}"

      # Publishing needs Docker Hub credentials, which are absent on Dependabot runs
      # and on pull requests from forks -- but present on a same-repo pull_request
      # (its secrets come from the base repo), where we still never want to push:
      # a PR build is just for the tests, and its images would tag-collide with the
      # branch's own push-triggered build. So pull_request never pushes, credentials
      # or not; everything else pushes only when credentials are present.
      - name: Registry credentials
        id: registry
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "::notice::Pull request build - building locally, images will not be pushed"
            echo "push=false" >> "${GITHUB_OUTPUT}"
          elif [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "::notice::Docker Hub credentials present - images will be pushed"
            echo "push=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::No Docker Hub credentials - building locally, images will not be pushed"
            echo "push=false" >> "${GITHUB_OUTPUT}"
          fi
      # The only endpoints compiled into the client (dockerFiles/configure.sh):
      # the tree/circuit/graph PDB and the search Solr. The development group
      # tests against the cluster pdb; alpha has its own; everything else is live.
      - name: Endpoints
        id: endpoints
        shell: bash
        run: |
          BRANCH="${{ steps.branch.outputs.value }}"
          PDB=https://pdb.v4.virtualflybrain.org
          SOLR=https://solr.virtualflybrain.org/solr/ontology/select
          if [ "$BRANCH" == master ] || [[ "$BRANCH" == v* ]]; then
            :
          elif [ "$BRANCH" == alpha ]; then
            PDB=https://pdb-alpha.virtualflybrain.org
            SOLR=https://solr-alpha.virtualflybrain.org/solr/ontology/select
          elif [ "$BRANCH" == debug ] || [ "$BRANCH" == pipeline2 ] || [ "$BRANCH" == vfb_geppetto_application ] || [ "$BRANCH" == development ] || [[ "$BRANCH" == f* ]]; then
            PDB=https://pdb.k8s.virtualflybrain.org
          fi
          echo "VFB_TREE_PDB_SERVER=$PDB" >> "$GITHUB_OUTPUT"
          echo "SOLR_SERVER=$SOLR" >> "$GITHUB_OUTPUT"
          echo "PDB: $PDB"
          echo "SOLR: $SOLR"

      # Loading the built image into the local daemon needs far more disk than pushing it
      # straight to the registry, so reclaim the runner's preinstalled toolchains first.
      - name: Free runner disk space
        if: steps.registry.outputs.push != 'true'
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup "${AGENT_TOOLSDIRECTORY}" || true
          sudo docker image prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      
      - name: Login to DockerHub
        if: steps.registry.outputs.push == 'true'
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # One static image (webpack bundles + nginx), published under both names
      # the Rancher stacks pull: -remote.wss was the production flavour and
      # -remote the tested one; without a server they are the same image.
      - name: Build and push
        id: docker_build
        timeout-minutes: 60
        uses: docker/build-push-action@v2
        with:
          # `.` uses the checked-out files; buildx's own git context cannot fetch
          # a pull_request's refs/pull/<n>/merge.
          context: .
          push: ${{ steps.registry.outputs.push == 'true' }}
          load: ${{ steps.registry.outputs.push != 'true' }}
          tags: |
            virtualflybrain/geppetto-vfb:${{ steps.branch.outputs.clean }}-remote
            virtualflybrain/geppetto-vfb:${{ steps.branch.outputs.clean }}-remote.wss
          build-args: |
            VFB_TREE_PDB_SERVER_ARG=${{ steps.endpoints.outputs.VFB_TREE_PDB_SERVER }}
            SOLR_SERVER_ARG=${{ steps.endpoints.outputs.SOLR_SERVER }}

      - name: Image digest
        run: echo "${{ steps.docker_build.outputs.digest }}"

      - name: Install Puppeteer
        run: npm install jest@24.8.0 jest-image-snapshot@4.1.0 puppeteer@1.17.0 jest-puppeteer@4.3.0 @babel/preset-env@7.4.5 url-join@4.0.0 @babel/core@7.4.5
      # nginx serves at once; wait for it rather than for a fixed time
      - name: Start VFB server
        run: docker run -d --name=testServer -p 8080:8080 "virtualflybrain/geppetto-vfb:${{ steps.branch.outputs.clean }}-remote"
      - name: Wait for VFB server
        run: |
          for i in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/org.geppetto.frontend/geppetto)" == "200" ]; then
              echo "$(date) - serving"; exit 0
            fi
            sleep 2
          done
          docker logs testServer
          exit 1
      - name: Test batch 1   
        run: npm test -- --verbose --colors --forceExit --testPathPattern='geppetto-vfb/tests/jest/vfb/batch1/.*js'
      - name: Test batch 2   
        run: npm test -- --verbose --colors --forceExit --testPathPattern='geppetto-vfb/tests/jest/vfb/batch2/.*js'
      - name: Test batch 3   
        run: npm test -- --verbose --colors --forceExit --testPathPattern='geppetto-vfb/tests/jest/vfb/batch3/.*js'
      - name: Test batch 4
        run: |
          if ls tests/jest/vfb/batch4/*.js >/dev/null 2>&1; then
            npm test -- --verbose --colors --forceExit --testPathPattern='geppetto-vfb/tests/jest/vfb/batch4/.*js'
          else
            echo "No tests found in tests/jest/vfb/batch4 - skipping."
          fi
      - name: Test under review  
        continue-on-error: true
        run: |
          if [ "${{ steps.branch.outputs.value }}" == debug ] || [ "${{ steps.branch.outputs.value }}" == pipeline2 ] || [ "${{ steps.branch.outputs.value }}" == vfb_geppetto_application ] || [ "${{ steps.branch.outputs.value }}" == development ] || [[ "${{ steps.branch.outputs.value }}" =~ ^(fix|feature).* ]] ; then
            npm test -- --verbose --colors --forceExit --testPathPattern='geppetto-vfb/tests/jest/vfb/review/.*js';
          fi
      - name: Stop VFB server   
        run: docker stop testServer
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: test_fails
          path: |
            tests/jest/vfb/snapshots/*/*/__diff_output__/*.png
            tests/jest/vfb/snapshots/*/*/*.png
            tests/jest/vfb/snapshots/*/*.png
          retention-days: 5
